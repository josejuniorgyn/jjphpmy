
        # phpMyAdmin {{pma_version}}
        location ^~ /phpmyadmin {
            alias "{{phpmyadmin}}";
            index index.php;
            allow 127.0.0.1;
            allow ::1;
            deny  all;
            location ~ \.php$ {
                fastcgi_pass   127.0.0.1:{{fastcgi_port}};
                fastcgi_param  SCRIPT_FILENAME $request_filename;
                include        "{{nginx}}/conf/fastcgi_params";
            }
        }

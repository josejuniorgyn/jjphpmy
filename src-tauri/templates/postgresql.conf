# Gerado pelo JJPHPMY. Lido pelo postgresql.conf da pasta de dados
# (include_if_exists). Se você editar este arquivo, o JJPHPMY deixa de
# sobrescrevê-lo (use "Recriar arquivos de configuração" para voltar ao padrão).

port = {{port}}
listen_addresses = 'localhost'
logging_collector = on
log_directory = '{{logs}}/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
timezone = 'America/Sao_Paulo'

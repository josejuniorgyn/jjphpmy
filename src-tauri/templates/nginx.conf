# Gerado pelo JJPHPMY. Se você editar este arquivo, o JJPHPMY deixa de
# sobrescrevê-lo (use "Recriar arquivos de configuração" para voltar ao padrão).

worker_processes  1;
error_log  "{{logs}}/nginx/error.log" warn;
pid        "{{logs}}/nginx/nginx.pid";

events {
    worker_connections  1024;
}

http {
    include       "{{nginx}}/conf/mime.types";
    default_type  application/octet-stream;
    access_log    "{{logs}}/nginx/access.log";
    sendfile      off;
    keepalive_timeout  65;
    client_max_body_size 100m;

    client_body_temp_path "{{tmp}}/nginx/client_body";
    proxy_temp_path       "{{tmp}}/nginx/proxy";
    fastcgi_temp_path     "{{tmp}}/nginx/fastcgi";
    uwsgi_temp_path       "{{tmp}}/nginx/uwsgi";
    scgi_temp_path        "{{tmp}}/nginx/scgi";

    server {
        listen       {{port}};
{{ssl_listen}}        server_name  localhost;
        root         "{{www}}";
        index        index.php index.html index.htm;
        autoindex    on;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
{{php_block}}{{phpmyadmin_block}}
        location ~ /\.ht {
            deny all;
        }
    }

    # Hosts virtuais ({name}.test), criados pelo JJPHPMY na Etapa 6.
    include "{{etc}}/nginx/sites-enabled/*.conf";
}

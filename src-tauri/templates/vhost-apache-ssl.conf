
<VirtualHost *:{{ssl_port}}>
    ServerName {{host}}
    ServerAlias *.{{host}}
    DocumentRoot "{{root}}"
    SSLEngine on
    SSLCertificateFile "{{cert}}"
    SSLCertificateKeyFile "{{key}}"
    <Directory "{{root}}">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

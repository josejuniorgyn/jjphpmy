# Gerado pelo JJPHPMY para a pasta {{folder}} (www\{{folder}}).
# Arquivos "auto.*" são recriados sozinhos; para personalizar, crie outro .conf.
<VirtualHost *:{{port}}>
    ServerName {{host}}
    ServerAlias *.{{host}}
    DocumentRoot "{{root}}"
    <Directory "{{root}}">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
{{ssl_vhost}}
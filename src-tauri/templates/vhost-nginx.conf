# Gerado pelo JJPHPMY para a pasta {{folder}} (www\{{folder}}).
# Arquivos "auto.*" são recriados sozinhos; para personalizar, crie outro .conf.
server {
    listen       {{port}};
{{ssl_listen}}    server_name  {{host}} *.{{host}};
    root         "{{root}}";
    index        index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
{{php_block}}
    location ~ /\.ht {
        deny all;
    }
}

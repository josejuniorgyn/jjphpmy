# Gerado pelo JJPHPMY. Se você editar este arquivo, o JJPHPMY deixa de
# sobrescrevê-lo (use "Recriar arquivos de configuração" para voltar ao padrão).

[client]
port = {{port}}
default-character-set = utf8mb4

[mysqld]
port = {{port}}
bind-address = 127.0.0.1
basedir = "{{mysql}}"
datadir = "{{datadir}}"
tmpdir = "{{tmp}}"
log-error = "{{logs}}/mysql/mysql.err"
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci
max_allowed_packet = 512M
innodb_buffer_pool_size = 256M
# Mesmo comportamento do Laragon: aceita datas zeradas e GROUP BY antigo.
sql_mode = "NO_ENGINE_SUBSTITUTION"
